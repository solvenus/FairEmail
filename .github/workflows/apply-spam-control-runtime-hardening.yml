name: Apply Spam Control runtime hardening

on:
  push:
    branches:
      - feature/spam-families
    paths:
      - .github/scripts/apply_spam_control_runtime_hardening.py
      - .github/workflows/apply-spam-control-runtime-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spam-families
          fetch-depth: 0
      - name: Apply runtime hardening
        run: python3 .github/scripts/apply_spam_control_runtime_hardening.py
      - name: Commit patch safely on current branch head
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/eu/faircode/email/ActivitySpamControl.java \
            app/src/main/java/eu/faircode/email/SpamFamilyIdentity.java \
            app/src/main/java/eu/faircode/email/SpamIntelligence.java \
            app/src/main/java/eu/faircode/email/SpamFamilyLabRepository.java \
            tools/spam-family-lab/SpamFamilyIdentityLab.java
          git commit -m "Harden Spam Control review semantics"

          for attempt in 1 2 3; do
            git fetch origin feature/spam-families
            git rebase origin/feature/spam-families
            if git push origin HEAD:feature/spam-families; then
              exit 0
            fi
            echo "Branch moved during push; retrying safely ($attempt/3)"
          done
          echo "Could not fast-forward runtime hardening after 3 retries" >&2
          exit 1
