name: Repair Spam Control Java escapes

on:
  push:
    branches:
      - feature/spam-families
    paths:
      - .github/scripts/repair_spam_control_java_escapes.py
      - .github/workflows/repair-spam-control-java-escapes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spam-families
          fetch-depth: 0
      - name: Repair generated Java escapes
        run: python3 .github/scripts/repair_spam_control_java_escapes.py
      - name: Commit repair safely on current branch head
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/faircode/email/ActivitySpamControl.java
          git commit -m "Repair Spam Control Java escapes"
          for attempt in 1 2 3; do
            git fetch origin feature/spam-families
            git rebase origin/feature/spam-families
            if git push origin HEAD:feature/spam-families; then
              exit 0
            fi
            echo "Branch moved during push; retrying safely ($attempt/3)"
          done
          echo "Could not fast-forward escape repair after 3 retries" >&2
          exit 1
