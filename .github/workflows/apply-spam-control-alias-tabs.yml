name: Apply Spam Control alias tabs

on:
  push:
    branches:
      - feature/spam-control-p0
    paths:
      - '.github/scripts/patch_spam_control_alias_tabs.py'
      - '.github/workflows/apply-spam-control-alias-tabs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fail-closed alias tabs patch
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_spam_control_alias_tabs.py
          git diff --check
          git status --short
      - name: Commit and rebase safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/faircode/email/ActivitySpamControl.java
          git diff --cached --quiet && { echo "No patch changes"; exit 0; }
          git commit -m "Render alias categories as separate tabs"
          git fetch origin feature/spam-control-p0
          git rebase origin/feature/spam-control-p0
          git push origin HEAD:feature/spam-control-p0
