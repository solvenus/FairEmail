name: Apply Spam Control P0 Round

on:
  push:
    branches:
      - feature/spam-control-p0
    paths:
      - '.github/workflows/apply-spam-control-p0-round.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fail-closed P0 patches
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_spam_control_p0_bulk.py
          python3 .github/scripts/patch_spam_control_history_smtp.py
          git diff --check
          git status --short
      - name: Commit and rebase safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/eu/faircode/email/ActivitySpamControl.java \
            app/src/main/java/eu/faircode/email/DaoAlias.java \
            app/src/main/java/eu/faircode/email/DaoMessage.java \
            app/src/main/java/eu/faircode/email/SpamFamilyLabRepository.java \
            app/src/main/java/eu/faircode/email/SpamIntelligence.java \
            app/src/main/java/eu/faircode/email/SpamLearningSnapshot.java \
            app/src/main/java/eu/faircode/email/SpamUndoManager.java
          git diff --cached --quiet && { echo "No patch changes"; exit 0; }
          git commit -m "Add P0 bulk learning historical scan and SMTP lifecycle"
          git fetch origin feature/spam-control-p0
          git rebase origin/feature/spam-control-p0
          git push origin HEAD:feature/spam-control-p0
