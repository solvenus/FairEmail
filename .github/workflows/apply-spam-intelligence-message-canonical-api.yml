name: Apply canonical Spam message state via API

# trigger: 2026-09-15T18:20+02:00
on:
  push:
    branches: [feature/spam-control-p0]
    paths: ['.github/workflows/apply-spam-intelligence-message-canonical-api.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: feature/spam-control-p0
    steps:
      - name: Patch SpamIntelligence through Contents API
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, tempfile, urllib.parse, urllib.request
          repo=os.environ['REPO']; branch=os.environ['BRANCH']; token=os.environ['GH_TOKEN']
          src_path='app/src/main/java/eu/faircode/email/SpamIntelligence.java'
          script_path='.github/scripts/patch_spam_intelligence_message_canonical.py'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'spam-message-state-patcher'}
          def get(path):
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}?ref={urllib.parse.quote(branch)}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r: return json.loads(r.read().decode())
          def put(path,sha,content):
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}'
              payload=json.dumps({'message':'Use canonical Spam Control message state','content':base64.b64encode(content.encode()).decode(),'sha':sha,'branch':branch}).encode()
              with urllib.request.urlopen(urllib.request.Request(url,data=payload,method='PUT',headers=headers)) as r: return json.loads(r.read().decode())
          src=get(src_path); script=get(script_path); txt=base64.b64decode(src['content']).decode()
          if 'SpamMessageStore.observe(context, account.uuid, message.id' in txt and 'refreshMessageFamilyState' in txt:
              print('already patched'); raise SystemExit(0)
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td); p=root/src_path; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(txt)
              s=root/script_path; s.parent.mkdir(parents=True,exist_ok=True); s.write_text(base64.b64decode(script['content']).decode())
              subprocess.run(['python3',str(s)],cwd=root,check=True)
              out=p.read_text()
          for needle in ['SpamMessageStore.observe(context, account.uuid, message.id','DaoSpamMessage messageDao','refreshMessageFamilyState','EntitySpamMessage beforeMessage']:
              assert needle in out, needle
          res=put(src_path,src['sha'],out); print('updated',res['commit']['sha'])
          PY
