name: Fix fourth alias bucket navigation

on:
  push:
    branches:
      - feature/spam-control-p0
    paths:
      - '.github/scripts/fix_alias_bucket_fourth_tab.py'
      - '.github/workflows/fix-alias-bucket-fourth-tab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fail-closed fourth bucket navigation fix
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_alias_bucket_fourth_tab.py
          git diff --check
          grep -F 'Math.min(3, bucket)' app/src/main/java/eu/faircode/email/ActivitySpamControl.java
      - name: Commit and rebase safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/faircode/email/ActivitySpamControl.java
          git diff --cached --quiet && { echo "No patch changes"; exit 0; }
          git commit -m "Fix navigation to inactive alias bucket"
          git fetch origin feature/spam-control-p0
          git rebase origin/feature/spam-control-p0
          git push origin HEAD:feature/spam-control-p0
