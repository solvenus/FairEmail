name: Audit Spam Family legacy state influence

on:
  push:
    branches:
      - changeset/spam-control-family-correction-semantics
    paths:
      - '.github/workflows/audit-spam-family-legacy-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Map exact-family writers readers and legacy exclusions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== learnSpamIntoFamily ==='
          git grep -n -F 'learnSpamIntoFamily(' -- . || true
          echo
          echo '=== bindIdentity ==='
          git grep -n -F 'bindIdentity(' -- . || true
          echo
          echo '=== matchIdentity ==='
          git grep -n -F 'matchIdentity(' -- . || true
          echo
          echo '=== isExcluded ==='
          git grep -n -F 'isExcluded(' -- . || true
          echo
          echo '=== exclusion DAO symbols ==='
          git grep -n -E 'Exclusion|exclusion|spam_family_exclusion' -- app/src/main/java/eu/faircode/email || true
          echo
          echo '=== reassign symbols ==='
          git grep -n -E 'reassign\(|SpamFamilyReassigner' -- app/src/main/java/eu/faircode/email || true
          echo
          echo '=== direct requested-family Spam learning callers ==='
          git grep -n -F 'learnSpam(' -- app/src/main/java/eu/faircode/email | grep -v 'public static void learnSpam' || true
          echo
          echo '=== explicit family-id label callers ==='
          git grep -n -E 'setLabel\([^\n]*LABEL_SPAM|learnSpam\([^\n]*family' -- app/src/main/java/eu/faircode/email || true
          echo
          echo '=== exclusion table migration/schema/reset references ==='
          git grep -n -E 'spam_family_exclusion|EntitySpamFamilyExclusion|delete.*Exclusion|clear.*Exclusion' -- app/src/main/java/eu/faircode/email .github docs || true
