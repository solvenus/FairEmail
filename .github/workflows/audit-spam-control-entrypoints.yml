# Final-head verification pulse 2
# Post-retirement final-head gate
name: Audit Spam Control entrypoints

on:
  push:
    branches:
      - feature/spam-control-p0
      - changeset/spam-control-family-correction-semantics
    paths:
      - '.github/workflows/audit-spam-control-entrypoints.yml'
      - 'app/src/githubDebug/AndroidManifest.xml'
      - 'app/src/main/java/eu/faircode/email/ActivitySpamControl.java'
      - 'app/src/main/java/eu/faircode/email/ActivitySpamFamilyLab.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove Spam Control has one runtime entrypoint
        run: |
          set -euo pipefail
          grep -F 'android:name=".ActivitySpamControl"' app/src/githubDebug/AndroidManifest.xml
          grep -F '<action android:name="android.intent.action.MAIN" />' app/src/githubDebug/AndroidManifest.xml
          grep -F '<category android:name="android.intent.category.LAUNCHER" />' app/src/githubDebug/AndroidManifest.xml
          if git grep -n -F 'ActivitySpamFamilyLab' -- app/src; then
            echo 'Legacy Spam Family Lab must not exist in runtime source or manifest' >&2
            exit 1
          fi
          echo 'PASS: ActivitySpamControl is the sole Spam Control runtime entrypoint'
