name: Apply canonical Spam message consumers via API

on:
  push:
    branches: [feature/spam-control-p0]
    paths: ['.github/workflows/apply-spam-message-consumers-api.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: feature/spam-control-p0
    steps:
      - name: Patch canonical Spam consumers through Contents API
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, tempfile, urllib.parse, urllib.request
          repo=os.environ['REPO']; branch=os.environ['BRANCH']; token=os.environ['GH_TOKEN']
          files=[
            'app/src/main/java/eu/faircode/email/SpamFamilyLabRepository.java',
            'app/src/main/java/eu/faircode/email/SpamControlQueueStats.java',
            'app/src/main/java/eu/faircode/email/DaoSpamMessage.java',
            'app/src/main/java/eu/faircode/email/SpamExactBulkPropagator.java',
            'app/src/main/java/eu/faircode/email/SpamFamilyRescorer.java',
            'app/src/main/java/eu/faircode/email/DaoSpamFamily.java']
          script_path='.github/scripts/patch_spam_message_consumers.py'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'spam-message-consumer-patcher'}
          def get(path):
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}?ref={urllib.parse.quote(branch)}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r: return json.loads(r.read().decode())
          def put(path,sha,content):
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}'
              payload=json.dumps({'message':'Move Spam Control consumers to canonical message state','content':base64.b64encode(content.encode()).decode(),'sha':sha,'branch':branch}).encode()
              with urllib.request.urlopen(urllib.request.Request(url,data=payload,method='PUT',headers=headers)) as r: return json.loads(r.read().decode())
          current={p:get(p) for p in files}; script=get(script_path)
          if 'List<EntitySpamMessage> states = messageDao.getReviewQueue' in base64.b64decode(current[files[0]]['content']).decode():
              print('already patched'); raise SystemExit(0)
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td)
              for p,obj in current.items():
                  q=root/p; q.parent.mkdir(parents=True,exist_ok=True); q.write_text(base64.b64decode(obj['content']).decode())
              s=root/script_path; s.parent.mkdir(parents=True,exist_ok=True); s.write_text(base64.b64decode(script['content']).decode())
              subprocess.run(['python3',str(s)],cwd=root,check=True)
              outputs={p:(root/p).read_text() for p in files}
          checks={
            files[0]:['List<EntitySpamMessage> states','Candidate.from(state, delivery','message().get(resolved.account.uuid, messageId)'],
            files[1]:['.message().countReviewQueue'],
            files[2]:['EXISTS (SELECT 1 FROM alias_delivery d'],
            files[3]:['List<EntitySpamMessage> page = messageDao.getUnknownAfter'],
            files[4]:['List<EntitySpamMessage> page = messageDao.getRescorePage'],
            files[5]:['SELECT COUNT(*) FROM spam_message d']}
          for p,needles in checks.items():
              for n in needles: assert n in outputs[p], (p,n)
          # Each PUT uses the SHA fetched before any writes. Files are independent;
          # concurrent changes to any one path fail closed with HTTP 409/422.
          for p in files:
              res=put(p,current[p]['sha'],outputs[p]); print('updated',p,res['commit']['sha'])
          PY
