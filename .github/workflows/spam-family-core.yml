# Gate trigger: exact-family semantics + reversible cPanel route planning
name: Spam Family Core

on:
  push:
    branches:
      - feature/spam-families
      - feature/spam-control-p0
    paths:
      - 'app/src/main/java/eu/faircode/email/SpamFamilyEngine.java'
      - 'app/src/main/java/eu/faircode/email/SpamFamilyFingerprint.java'
      - 'app/src/main/java/eu/faircode/email/SpamFamilyIdentity.java'
      - 'app/src/main/java/eu/faircode/email/SpamFamilyPredictionPolicy.java'
      - 'app/src/main/java/eu/faircode/email/SpamDecisionScorer.java'
      - 'app/src/main/java/eu/faircode/email/SpamAliasReputation.java'
      - 'app/src/main/java/eu/faircode/email/AliasTrafficScorer.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainSuggestionScorer.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnPolicy.java'
      - 'app/src/main/java/eu/faircode/email/AliasCompromisePolicy.java'
      - 'app/src/main/java/eu/faircode/email/CpanelForwarderRoutePlan.java'
      - 'tools/spam-family-lab/**'
      - '.github/workflows/spam-family-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile pure Java spam core
        run: |
          set -euo pipefail
          mkdir -p build/spam-family-core
          javac -encoding UTF-8 \
            -d build/spam-family-core \
            app/src/main/java/eu/faircode/email/SpamFamilyFingerprint.java \
            app/src/main/java/eu/faircode/email/SpamFamilyEngine.java \
            app/src/main/java/eu/faircode/email/SpamFamilyIdentity.java \
            app/src/main/java/eu/faircode/email/SpamFamilyPredictionPolicy.java \
            app/src/main/java/eu/faircode/email/SpamDecisionScorer.java \
            app/src/main/java/eu/faircode/email/SpamAliasReputation.java \
            app/src/main/java/eu/faircode/email/AliasTrafficScorer.java \
            app/src/main/java/eu/faircode/email/AliasDomainSuggestionScorer.java \
            app/src/main/java/eu/faircode/email/AliasBurnPolicy.java \
            app/src/main/java/eu/faircode/email/AliasCompromisePolicy.java \
            app/src/main/java/eu/faircode/email/CpanelForwarderRoutePlan.java \
            tools/spam-family-lab/SpamFamilyLab.java \
            tools/spam-family-lab/AliasBurnPolicyLab.java \
            tools/spam-family-lab/AliasCompromisePolicyLab.java \
            tools/spam-family-lab/SpamFamilySerializationLab.java \
            tools/spam-family-lab/SpamFamilyPredictionPolicyLab.java \
            tools/spam-family-lab/SpamDecisionScorerLab.java \
            tools/spam-family-lab/SpamFamilyIdentityLab.java \
            tools/spam-family-lab/CpanelForwarderRoutePlanLab.java
      - name: Run spam family lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.SpamFamilyLab
      - name: Run alias burn policy lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.AliasBurnPolicyLab
      - name: Run alias compromise policy lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.AliasCompromisePolicyLab
      - name: Run fingerprint serialization lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.SpamFamilySerializationLab
      - name: Run prediction ownership lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.SpamFamilyPredictionPolicyLab
      - name: Run combined spam decision lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.SpamDecisionScorerLab
      - name: Run exact spam family identity lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.SpamFamilyIdentityLab
      - name: Run cPanel route planner lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.CpanelForwarderRoutePlanLab
