name: Spam Family Core

on:
  push:
    branches:
      - feature/spam-families
    paths:
      - 'app/src/main/java/eu/faircode/email/SpamFamilyEngine.java'
      - 'app/src/main/java/eu/faircode/email/SpamFamilyFingerprint.java'
      - 'app/src/main/java/eu/faircode/email/SpamAliasReputation.java'
      - 'app/src/main/java/eu/faircode/email/AliasTrafficScorer.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainSuggestionScorer.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnPolicy.java'
      - 'tools/spam-family-lab/**'
      - '.github/workflows/spam-family-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile pure Java spam core
        run: |
          set -euo pipefail
          mkdir -p build/spam-family-core
          javac -encoding UTF-8 \
            -d build/spam-family-core \
            app/src/main/java/eu/faircode/email/SpamFamilyFingerprint.java \
            app/src/main/java/eu/faircode/email/SpamFamilyEngine.java \
            app/src/main/java/eu/faircode/email/SpamAliasReputation.java \
            app/src/main/java/eu/faircode/email/AliasTrafficScorer.java \
            app/src/main/java/eu/faircode/email/AliasDomainSuggestionScorer.java \
            app/src/main/java/eu/faircode/email/AliasBurnPolicy.java \
            tools/spam-family-lab/SpamFamilyLab.java \
            tools/spam-family-lab/AliasBurnPolicyLab.java
      - name: Run spam family lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.SpamFamilyLab
      - name: Run alias burn policy lab
        run: |
          set -euo pipefail
          java -cp build/spam-family-core eu.faircode.email.AliasBurnPolicyLab
