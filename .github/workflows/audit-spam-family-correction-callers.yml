name: Audit Spam Control family correction callers

on:
  push:
    branches:
      - changeset/spam-control-family-correction-semantics
    paths:
      - '.github/workflows/audit-spam-family-correction-callers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Map legacy family correction callers and reachability
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Runtime ActivitySpamFamilyLab references ==='
          git grep -n -F 'ActivitySpamFamilyLab' -- app/src || true
          echo
          echo '=== Runtime markSameSpam callers ==='
          git grep -n -F 'markSameSpam(' -- app/src || true
          echo
          echo '=== Runtime markOtherSpam callers ==='
          git grep -n -F 'markOtherSpam(' -- app/src || true
          echo
          echo '=== Runtime confirmSpam callers ==='
          git grep -n -F 'confirmSpam(' -- app/src || true
          echo
          echo '=== Runtime excludeFromFamily callers ==='
          git grep -n -F 'excludeFromFamily(' -- app/src || true
          echo
          echo '=== Runtime SpamFamilyReassigner references ==='
          git grep -n -F 'SpamFamilyReassigner' -- app/src || true
          echo
          echo '=== Runtime SpamFamilyHumanActions references ==='
          git grep -n -F 'SpamFamilyHumanActions' -- app/src || true
          echo
          echo '=== SAME_SPAM / OTHER_SPAM action references ==='
          git grep -n -E 'ACTION_(SAME_SPAM|OTHER_SPAM)' -- app/src || true
          echo
          echo '=== Manifest references to Spam Family Lab / Spam Control ==='
          git grep -n -E 'ActivitySpam(FamilyLab|Control)' -- 'app/src/**/AndroidManifest.xml' || true
          echo
          echo '=== Intent/class-name launches mentioning Spam Family Lab ==='
          git grep -n -E 'Intent\([^\n]*ActivitySpamFamilyLab|setClass[^\n]*ActivitySpamFamilyLab|ActivitySpamFamilyLab\.class' -- app/src || true
          echo
          echo '=== Whole-repository dependencies on legacy correction symbols ==='
          for token in \
            'ActivitySpamFamilyLab' \
            'SpamFamilyHumanActions' \
            'SpamFamilyReassigner' \
            'ACTION_SAME_SPAM' \
            'ACTION_OTHER_SPAM'; do
            echo "--- $token ---"
            git grep -n -F "$token" -- . || true
          done
          echo
          echo '=== Whole-repository direct method references ==='
          for token in 'confirmSpam(' 'markOtherSpam(' 'excludeFromFamily('; do
            echo "--- $token ---"
            git grep -n -F "$token" -- . || true
          done
