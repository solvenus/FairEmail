name: Apply historical reply alias recovery v4

on:
  push:
    branches:
      - feature/spam-families
    paths:
      - .github/scripts/apply_reply_alias_on_demand_v4.py
      - .github/workflows/apply-reply-alias-on-demand-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spam-families
          fetch-depth: 0

      - name: Apply historical reply alias recovery
        run: python3 .github/scripts/apply_reply_alias_on_demand_v4.py

      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/faircode/email/FragmentCompose.java
          git commit -m "Recover historical reply aliases on demand"
          git push origin HEAD:feature/spam-families
