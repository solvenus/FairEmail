# Post-retirement final-head gate
name: Verify Spam Control bootstrap contract

on:
  push:
    branches:
      - feature/spam-control-p0
      - changeset/spam-control-family-correction-semantics
      - audit/spam-control-bootstrap-contract
    paths:
      - '.github/scripts/verify_spam_control_bootstrap_contract.py'
      - '.github/workflows/verify-spam-control-bootstrap-contract.yml'
      - 'app/src/main/java/eu/faircode/email/DaoSpamMessage.java'
      - 'app/src/main/java/eu/faircode/email/SpamExactBulkPropagator.java'
      - 'app/src/main/java/eu/faircode/email/SpamLearningSnapshot.java'
      - 'app/src/main/java/eu/faircode/email/SpamMessageStore.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify bootstrap and message-authority contract
        run: python3 .github/scripts/verify_spam_control_bootstrap_contract.py
