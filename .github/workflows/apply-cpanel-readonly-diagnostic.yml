name: Apply cPanel read-only diagnostic

on:
  push:
    branches:
      - feature/spam-control-p0
    paths:
      - '.github/scripts/patch_cpanel_readonly_diagnostic.py'
      - '.github/workflows/apply-cpanel-readonly-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply fail-closed read-only diagnostic patch
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_cpanel_readonly_diagnostic.py
          git diff --check
          grep -F 'Test cPanel (kun lesing)' app/src/main/java/eu/faircode/email/ActivitySpamControl.java
          grep -F 'public Diagnostic diagnose' app/src/main/java/eu/faircode/email/CpanelAliasActuator.java
      - name: Commit and rebase safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/faircode/email/CpanelAliasActuator.java \
                  app/src/main/java/eu/faircode/email/ActivitySpamControl.java
          git diff --cached --quiet && { echo "No patch changes"; exit 0; }
          git commit -m "Add read-only cPanel connection test"
          git fetch origin feature/spam-control-p0
          git rebase origin/feature/spam-control-p0
          git push origin HEAD:feature/spam-control-p0
