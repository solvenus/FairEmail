# Final-head verification pulse 2
# Post-retirement final-head gate
name: Verify reply-from-alias authority

on:
  push:
    branches:
      - feature/spam-control-p0
      - changeset/spam-control-family-correction-semantics
    paths:
      - '.github/scripts/verify_reply_alias_authority.py'
      - '.github/workflows/verify-reply-alias-authority.yml'
      - 'app/src/main/java/eu/faircode/email/FragmentCompose.java'
      - 'app/src/main/java/eu/faircode/email/SpamIntelligence.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify reply alias semantic chain
        run: python3 .github/scripts/verify_reply_alias_authority.py
