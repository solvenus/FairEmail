name: Apply spam human UX follow-up

on:
  push:
    branches:
      - feature/spam-families
    paths:
      - .github/scripts/apply_spam_human_ux_followup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spam-families
          fetch-depth: 0

      - name: Apply exact source patches
        run: python3 .github/scripts/apply_spam_human_ux_followup.py

      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/faircode/email/ActivitySpamFamilyLab.java \
                  app/src/main/java/eu/faircode/email/FragmentCompose.java \
                  app/src/main/java/eu/faircode/email/SpamFamilyLabRepository.java
          git commit -m "Apply exact Spam Control follow-up"
          git push origin HEAD:feature/spam-families
