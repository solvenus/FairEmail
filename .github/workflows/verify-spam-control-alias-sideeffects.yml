# Post-retirement final-head gate
name: Verify Spam Control alias side effects

on:
  push:
    branches:
      - feature/spam-control-p0
      - changeset/spam-control-family-correction-semantics
      - audit/spam-control-alias-sideeffects
    paths:
      - '.github/scripts/verify_spam_control_alias_sideeffects.py'
      - '.github/workflows/verify-spam-control-alias-sideeffects.yml'
      - 'app/src/main/java/eu/faircode/email/SpamIntelligence.java'
      - 'app/src/main/java/eu/faircode/email/SpamAliasStore.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify canonical message and legacy alias contract
        run: python3 .github/scripts/verify_spam_control_alias_sideeffects.py
