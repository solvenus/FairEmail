name: Apply Spam message DB11 via API

on:
  push:
    branches: [feature/spam-control-p0]
    paths: ['.github/workflows/apply-spam-message-db11-api.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: feature/spam-control-p0
    steps:
      - name: Patch SpamIntelligenceDB through Contents API
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, tempfile, urllib.parse, urllib.request
          repo=os.environ['REPO']; branch=os.environ['BRANCH']; token=os.environ['GH_TOKEN']
          src_path='app/src/main/java/eu/faircode/email/SpamIntelligenceDB.java'
          script_path='.github/scripts/patch_spam_message_db11.py'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'spam-message-db11-patcher'}
          def get(path):
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}?ref={urllib.parse.quote(branch)}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r: return json.loads(r.read().decode())
          def put(path,sha,content):
              url=f'https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(path)}'
              payload=json.dumps({'message':'Add canonical Spam Control message index DB11','content':base64.b64encode(content.encode()).decode(),'sha':sha,'branch':branch}).encode()
              with urllib.request.urlopen(urllib.request.Request(url,data=payload,method='PUT',headers=headers)) as r: return json.loads(r.read().decode())
          src=get(src_path); script=get(script_path)
          txt=base64.b64decode(src['content']).decode()
          if 'version = 11' in txt and 'EntitySpamMessage.class' in txt and 'MIGRATION_10_11' in txt:
              print('already patched'); raise SystemExit(0)
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td); p=root/src_path; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(txt)
              s=root/script_path; s.parent.mkdir(parents=True,exist_ok=True); s.write_text(base64.b64decode(script['content']).decode())
              subprocess.run(['python3',str(s)],cwd=root,check=True)
              out=p.read_text()
          for needle in ['version = 11','EntitySpamMessage.class','MIGRATION_10_11','public abstract DaoSpamMessage message()']:
              assert needle in out, needle
          res=put(src_path,src['sha'],out); print('updated',res['commit']['sha'])
          PY
