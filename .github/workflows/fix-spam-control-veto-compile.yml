name: Fix Spam Control veto compile

on:
  push:
    branches:
      - feature/spam-control-p0
    paths:
      - '.github/scripts/fix_spam_control_veto_compile.py'
      - '.github/workflows/fix-spam-control-veto-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact compile fix
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_spam_control_veto_compile.py
          git diff --check
      - name: Commit and rebase safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/eu/faircode/email/ActivitySpamControl.java
          git diff --cached --quiet && { echo "No patch changes"; exit 0; }
          git commit -m "Fix SMTP veto verification compile check"
          git fetch origin feature/spam-control-p0
          git rebase origin/feature/spam-control-p0
          git push origin HEAD:feature/spam-control-p0
