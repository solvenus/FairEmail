# Gate trigger: review conflict impact + alias lifecycle timeline
name: Spam Intelligence Android Compile

on:
  push:
    branches:
      - feature/spam-families
      - feature/spam-control-p0
    paths:
      - 'app/src/github/AndroidManifest.xml'
      - 'app/src/githubDebug/AndroidManifest.xml'
      - 'app/src/github/java/eu/faircode/email/ApplicationSecure.java'
      - 'app/src/main/java/eu/faircode/email/ActivitySpamControl.java'
      - 'app/src/main/java/eu/faircode/email/ActivitySpamFamilyLab.java'
      - 'app/src/main/java/eu/faircode/email/FragmentCompose.java'
      - 'app/src/main/java/eu/faircode/email/AliasBackfill.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnManager.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnPolicy.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnReadiness.java'
      - 'app/src/main/java/eu/faircode/email/AliasCompromisePolicy.java'
      - 'app/src/main/java/eu/faircode/email/AliasCompromiseReviewStore.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainAffinity.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainSuggestionScorer.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainSuggestions.java'
      - 'app/src/main/java/eu/faircode/email/AliasRegistry.java'
      - 'app/src/main/java/eu/faircode/email/AliasReplacementVerifier.java'
      - 'app/src/main/java/eu/faircode/email/AliasSenderManager.java'
      - 'app/src/main/java/eu/faircode/email/AliasServerActuator.java'
      - 'app/src/main/java/eu/faircode/email/AliasTrafficAnalyzer.java'
      - 'app/src/main/java/eu/faircode/email/AliasTrafficScorer.java'
      - 'app/src/main/java/eu/faircode/email/CpanelAliasActuator.java'
      - 'app/src/main/java/eu/faircode/email/CpanelForwarderRoutePlan.java'
      - 'app/src/main/java/eu/faircode/email/CpanelForwarderTransaction.java'
      - 'app/src/main/java/eu/faircode/email/DaoAlias.java'
      - 'app/src/main/java/eu/faircode/email/DaoMessage.java'
      - 'app/src/main/java/eu/faircode/email/DaoSpamFamily.java'
      - 'app/src/main/java/eu/faircode/email/DaoSpamActionHistory.java'
      - 'app/src/main/java/eu/faircode/email/DaoSpamSnapshot.java'
      - 'app/src/main/java/eu/faircode/email/EntityAlias.java'
      - 'app/src/main/java/eu/faircode/email/EntityAliasDelivery.java'
      - 'app/src/main/java/eu/faircode/email/EntitySpam*.java'
      - 'app/src/main/java/eu/faircode/email/SpamAliasStore.java'
      - 'app/src/main/java/eu/faircode/email/SpamControlPolicy.java'
      - 'app/src/main/java/eu/faircode/email/SpamControlQueueStats.java'
      - 'app/src/main/java/eu/faircode/email/SpamDecisionScorer.java'
      - 'app/src/main/java/eu/faircode/email/SpamExactBulkPropagator.java'
      - 'app/src/main/java/eu/faircode/email/SpamFamily*.java'
      - 'app/src/main/java/eu/faircode/email/SpamHistoricalScanner.java'
      - 'app/src/main/java/eu/faircode/email/SpamNetworkAnalyzer.java'
      - 'app/src/main/java/eu/faircode/email/SpamIntelligence.java'
      - 'app/src/main/java/eu/faircode/email/SpamIntelligenceDB.java'
      - 'app/src/main/java/eu/faircode/email/SpamIntentObserver.java'
      - 'app/src/main/java/eu/faircode/email/SpamLearningSnapshot.java'
      - 'app/src/main/java/eu/faircode/email/SpamResetManager.java'
      - 'app/src/main/java/eu/faircode/email/SpamUndoManager.java'
      - 'app/src/main/java/eu/faircode/email/TupleAliasDomainStats.java'
      - 'app/src/main/java/eu/faircode/email/TupleSpamFamily*.java'
      - '.github/keys/spam-families-debug.keystore.b64'
      - '.github/scripts/verify_spam_intelligence_migration.py'
      - '.github/workflows/spam-intelligence-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SPAM_FAMILIES_DEBUG_CERT_SHA256: 'CC:76:B0:A6:00:8D:13:29:B4:2E:02:80:69:80:EB:35:53:29:25:25:89:DC:A5:F8:44:81:63:4E:36:1C:48:C0'
  SPAM_FAMILIES_DEBUG_KEYSTORE_SHA256: 'a5b8dec7dfb22b8724291eea1f54771102873c454eb9d2f56049a86918bb2802'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Install stable Spam Families debug signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/spam-families-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          printf '%s  %s\n' "$SPAM_FAMILIES_DEBUG_KEYSTORE_SHA256" "$HOME/.android/debug.keystore" | sha256sum -c -

          keytool_output="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey)"
          actual_cert="$(printf '%s\n' "$keytool_output" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          test -n "$actual_cert"
          test "$actual_cert" = "$SPAM_FAMILIES_DEBUG_CERT_SHA256"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Compile GitHub debug Java and Room code
        run: ./gradlew :app:compileGithubDebugJavaWithJavac --stacktrace --no-daemon
      - name: Verify SpamIntelligenceDB migrations 8 to 10
        run: python3 .github/scripts/verify_spam_intelligence_migration.py
      - name: Assemble GitHub debug APK
        run: ./gradlew :app:assembleGithubDebug --stacktrace --no-daemon
      - name: Verify APK signing identity
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/github/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cert_output="$(keytool -printcert -jarfile "$APK")"
          actual_cert="$(printf '%s\n' "$cert_output" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d '\r')"
          test -n "$actual_cert"
          test "$actual_cert" = "$SPAM_FAMILIES_DEBUG_CERT_SHA256"
      - name: Prepare checksummed APK artifact
        run: |
          set -euo pipefail
          mkdir -p build/spam-families-artifact
          APK="$(find app/build/outputs/apk/github/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" build/spam-families-artifact/FairEmail-v1.2333a-github-debug.apk
          sha256sum build/spam-families-artifact/FairEmail-v1.2333a-github-debug.apk > build/spam-families-artifact/SHA256SUMS.txt
          printf '%s\n' "${GITHUB_SHA}" > build/spam-families-artifact/BUILD_COMMIT.txt
          printf '%s\n' "$SPAM_FAMILIES_DEBUG_CERT_SHA256" > build/spam-families-artifact/SIGNER_SHA256.txt
      - name: Upload Spam Families debug APK
        uses: actions/upload-artifact@v5
        with:
          name: FairEmail-SpamFamilies-githubDebug-${{ github.sha }}
          path: build/spam-families-artifact/
          if-no-files-found: error
          retention-days: 14
