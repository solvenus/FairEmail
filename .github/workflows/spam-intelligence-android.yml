name: Spam Intelligence Android Compile

on:
  push:
    branches:
      - feature/spam-families
    paths:
      - 'app/src/github/AndroidManifest.xml'
      - 'app/src/githubDebug/AndroidManifest.xml'
      - 'app/src/github/java/eu/faircode/email/ApplicationSecure.java'
      - 'app/src/main/java/eu/faircode/email/ActivitySpamFamilyLab.java'
      - 'app/src/main/java/eu/faircode/email/FragmentCompose.java'
      - 'app/src/main/java/eu/faircode/email/AliasBackfill.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnManager.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnPolicy.java'
      - 'app/src/main/java/eu/faircode/email/AliasBurnReadiness.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainAffinity.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainSuggestionScorer.java'
      - 'app/src/main/java/eu/faircode/email/AliasDomainSuggestions.java'
      - 'app/src/main/java/eu/faircode/email/AliasRegistry.java'
      - 'app/src/main/java/eu/faircode/email/AliasSenderManager.java'
      - 'app/src/main/java/eu/faircode/email/AliasServerActuator.java'
      - 'app/src/main/java/eu/faircode/email/AliasTrafficAnalyzer.java'
      - 'app/src/main/java/eu/faircode/email/AliasTrafficScorer.java'
      - 'app/src/main/java/eu/faircode/email/CpanelAliasActuator.java'
      - 'app/src/main/java/eu/faircode/email/DaoAlias.java'
      - 'app/src/main/java/eu/faircode/email/DaoSpamFamily.java'
      - 'app/src/main/java/eu/faircode/email/EntityAlias.java'
      - 'app/src/main/java/eu/faircode/email/EntityAliasDelivery.java'
      - 'app/src/main/java/eu/faircode/email/EntitySpam*.java'
      - 'app/src/main/java/eu/faircode/email/SpamAliasStore.java'
      - 'app/src/main/java/eu/faircode/email/SpamFamily*.java'
      - 'app/src/main/java/eu/faircode/email/SpamIntelligence.java'
      - 'app/src/main/java/eu/faircode/email/SpamIntelligenceDB.java'
      - 'app/src/main/java/eu/faircode/email/SpamIntentObserver.java'
      - 'app/src/main/java/eu/faircode/email/TupleAliasDomainStats.java'
      - 'app/src/main/java/eu/faircode/email/TupleSpamFamily*.java'
      - '.github/keys/spam-families-debug.keystore.b64'
      - '.github/scripts/verify_spam_intelligence_migration.py'
      - '.github/workflows/spam-intelligence-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SPAM_FAMILIES_DEBUG_CERT_SHA256: 'CC:76:B0:A6:00:8D:13:29:B4:2E:02:80:69:80:EB:35:53:29:25:25:89:DC:A5:F8:44:81:63:4E:36:1C:48:C0'
  SPAM_FAMILIES_DEBUG_KEYSTORE_SHA256: 'a5b8dec7dfb22b8724291eea1f54771102873c454eb9d2f56049a86918bb2802'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Install stable Spam Families debug signing key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/spam-families-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          printf '%s  %s\n' "$SPAM_FAMILIES_DEBUG_KEYSTORE_SHA256" "$HOME/.android/debug.keystore" | sha256sum -c -

          keytool_output="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey)"
          actual="$(awk '/^[[:space:]]*SHA256: / { sub(/^[[:space:]]*SHA256: /, ""); print; exit }' <<< "$keytool_output")"
          test "$actual" = "$SPAM_FAMILIES_DEBUG_CERT_SHA256"
          echo "Pinned debug signing certificate: $actual"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compile GitHub debug Java and Room code
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            :app:compileGithubDebugJavaWithJavac
      - name: Verify SpamIntelligenceDB migration 8 to 9
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_spam_intelligence_migration.py
      - name: Assemble GitHub debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-build-cache --no-configuration-cache \
            :app:assembleGithubDebug
      - name: Verify APK signing identity
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/github/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          mkdir -p build
          cert_output="$($apksigner verify --print-certs "$apk" 2>build/apksigner-warnings.log)"
          printf '%s\n' "$cert_output"
          if [[ "$cert_output" =~ certificate\ SHA-256\ digest:\ ([0-9A-Fa-f:]+) ]]; then
            actual="${BASH_REMATCH[1]}"
          else
            echo "Could not find certificate SHA-256 digest in apksigner output" >&2
            exit 1
          fi
          actual="$(tr '[:upper:]' '[:lower:]' <<< "$actual" | tr -d ':[:space:]')"
          expected="$(tr '[:upper:]' '[:lower:]' <<< "$SPAM_FAMILIES_DEBUG_CERT_SHA256" | tr -d ':[:space:]')"
          echo "APK signer digest normalized: $actual"
          echo "Expected digest normalized:   $expected"
          test "$actual" = "$expected"
          echo "Verified APK signing certificate: $SPAM_FAMILIES_DEBUG_CERT_SHA256"
      - name: Prepare checksummed APK artifact
        run: |
          set -euo pipefail
          mkdir -p build/spam-family-apk
          cp app/build/outputs/apk/github/debug/*.apk build/spam-family-apk/
          printf '%s\n' "$SPAM_FAMILIES_DEBUG_CERT_SHA256" > build/spam-family-apk/SIGNING_CERT_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > build/spam-family-apk/BUILD_COMMIT.txt
          (cd build/spam-family-apk && sha256sum *.apk > SHA256SUMS.txt)
          test -s build/spam-family-apk/SHA256SUMS.txt
      - name: Upload Spam Families debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FairEmail-SpamFamilies-githubDebug-${{ github.sha }}
          path: build/spam-family-apk/
          if-no-files-found: error
          retention-days: 14
