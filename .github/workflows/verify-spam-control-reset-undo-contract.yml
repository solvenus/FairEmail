# Final-head verification pulse 2
# Post-retirement final-head gate
name: Verify Spam Control reset and undo contract

on:
  push:
    branches:
      - feature/spam-control-p0
      - changeset/spam-control-family-correction-semantics
      - audit/spam-control-reset-undo-contract
    paths:
      - '.github/scripts/verify_spam_control_reset_undo_contract.py'
      - '.github/workflows/verify-spam-control-reset-undo-contract.yml'
      - 'app/src/main/java/eu/faircode/email/SpamLearningSnapshot.java'
      - 'app/src/main/java/eu/faircode/email/SpamUndoManager.java'
      - 'app/src/main/java/eu/faircode/email/SpamResetManager.java'
      - 'app/src/main/java/eu/faircode/email/DaoSpamSnapshot.java'
      - 'app/src/main/java/eu/faircode/email/DaoSpamMessage.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify reset and undo semantics
        run: python3 .github/scripts/verify_spam_control_reset_undo_contract.py
